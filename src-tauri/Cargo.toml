[package]
name = "qwley-shade-launcher"
version = "1.0.7"
description = "Qwley Shade Launcher"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
