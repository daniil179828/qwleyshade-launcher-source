<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:32px;position:relative;overflow:hidden;
  background:#0a0a0b;color:#ededef;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* фон — логотип, размытый и затемнённый */
.bg{position:fixed;inset:-10%;background:url('assets/logo.png') center/cover no-repeat;
  filter:blur(60px) saturate(1.1);transform:scale(1.15);z-index:0}
.bg::after{content:"";position:absolute;inset:0;background:rgba(8,8,10,.78)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 45%,transparent,rgba(6,6,8,.85))}

.card{position:relative;z-index:2;width:100%;max-width:420px;text-align:center}
.logo{width:100px;height:100px;border-radius:22px;object-fit:cover;margin:0 auto 24px;display:block;

  font-size:44px;letter-spacing:.01em;line-height:1.1}
p{color:#a09a93;font-size:15px;margin-top:12px}
.btns{display:grid;gap:11px;margin-top:34px}
a.b{display:block;padding:15px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;transition:.18s}
.dl{background:#e8853a;color:#120a03;border:1px solid #e8853a}
.dl:hover{filter:brightness(2.09)}
.tg{background:rgba(255,255,255,.04);color:#ededef;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.tg:hover{background:rgba(255,255,255,.09)}
footer{margin-top:26px;font-size:13px;color:#79737c;font-family:'Playfair Display',serif;font-style:italic}
</style>
</head>
<body>
